[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pha-reference"
version = "0.1.0"
description = "Reproducible reference database of known/annotated PHA-related proteins (BRENDA + UniProt), used to identify PHA proteins in GOPC and OMDB."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "tenacity>=8.2,<9.0",
    "rich>=13.7,<14.0",
    "ijson>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]
# umap-learn pulls in numba/llvmlite (heavier, slower first-import) for a
# nonlinear alternative to the PCA embedding pipeline/sequence_embedding.py
# always provides -- optional so the core install stays light; that module
# detects its absence and falls back to PCA-only with a clear message
# rather than failing.
umap = [
    "umap-learn>=0.5,<0.6",
]

[project.scripts]
pha-reference = "phaatlas.cli:app"

# Explicit package list rather than setuptools' glob-based `find` --
# `PHA_reference/` (the canonical data directory, must keep that exact
# name/case per spec) sits right next to this package in the repo root,
# and on a case-insensitive filesystem (default macOS/APFS) BOTH `find`'s
# own directory globbing and its `include` pattern matching resolve
# case-insensitively too, at the OS level -- confirmed live: `include =
# ["pha_ref*"]` matched `PHA_reference/` as well as `pha_ref/` (the real
# package), producing a broken editable install that registered a bogus
# second top-level module pointing at the data directory. An explicit list
# sidesteps directory globbing entirely, so it's the only guaranteed-safe
# option as long as these two directories share a filesystem this closely.
[tool.setuptools]
packages = [
    "phaatlas",
    "phaatlas.db",
    "phaatlas.phenotype",
    "phaatlas.pipeline",
    "phaatlas.sources",
]
