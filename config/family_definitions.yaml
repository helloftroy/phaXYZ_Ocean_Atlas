# PHA reference database -- family configuration.
#
# This file drives the whole retrieval pipeline: nothing about a specific
# family (its EC number, its gene aliases, its UniProt search terms) is
# hardcoded in pha_reference/*.py. Add/edit a family here and re-run the
# same ingest-brenda/ingest-uniprot commands -- no code changes needed.
#
# Field meanings:
#   family_id            internal id, e.g. "phaC" or "phaR_synthase"
#                         (phaR_synthase and phaR_regulator are DELIBERATELY
#                         separate families even though both are called
#                         "phaR" -- see disambiguation_terms below)
#   display_name          human label
#   role                   one-line biological role (for docs/provenance only)
#   genes                  exact gene-name aliases to search UniProt for
#   exclude_genes          gene names that must NOT trigger this family even
#                          though they're related (e.g. bktB is thiolase-like
#                          but handled as its own family later, not phaA)
#   protein_name_terms     free-text protein-name phrases for UniProt's
#                          protein_name: search field
#   ec_brenda               EC number to use as the BRENDA starting point, or
#                          null to skip BRENDA entirely for this family
#                          (phasins/regulators/synthase-partners have no
#                          clean EC-based BRENDA coverage -- see README)
#   require_pha_context     if true, an EC/gene/protein-name hit is NOT
#                          enough on its own -- the record must also mention
#                          PHA/polyhydroxyalkanoate context (pathway text,
#                          keywords, or BRENDA general_information/synonyms)
#                          before being assigned to this family. Used for EC
#                          classes that are shared with non-PHA chemistry
#                          (e.g. 2.3.1.9 acetyl-CoA acetyltransferases,
#                          4.2.1.119 R-specific enoyl-CoA hydratases).
#   disambiguation_terms    for families that share a gene name with another
#                          family (phaR_synthase vs phaR_regulator): at least
#                          one of these phrases must appear in the UniProt
#                          protein name/function text for a gene:phaR hit to
#                          be assigned to THIS family rather than left
#                          unresolved for manual review.
#   broad_uniprot_search    if true, allow gene+protein_name+EC terms to be
#                          OR'd together in one broad UniProt query (only
#                          safe for families with a genuinely clean EC/name,
#                          per spec -- phaC is the only one enabled here).
#                          Every other family queries each term separately
#                          and tags the retrieval_reason per term so ambiguous
#                          hits stay traceable to exactly what matched.

families:
  - family_id: phaA
    display_name: "PhaA (beta-ketothiolase)"
    role: "acetyl-CoA/acetoacetyl-CoA precursor supply"
    genes: [phaA, phbA]
    exclude_genes: [bktB]
    protein_name_terms:
      - "acetyl-CoA acetyltransferase"
      - "acetoacetyl-CoA thiolase"
      - "3-ketothiolase"
      - "poly(3-hydroxybutyrate) biosynthesis thiolase"
    ec_brenda: "2.3.1.9"
    require_pha_context: true
    disambiguation_terms: []
    broad_uniprot_search: false

  - family_id: phaB
    display_name: "PhaB (acetoacetyl-CoA reductase)"
    role: "acetoacetyl-CoA reductase"
    genes: [phaB, phbB]
    exclude_genes: []
    protein_name_terms:
      - "acetoacetyl-CoA reductase"
      - "NADPH-dependent acetoacetyl-CoA reductase"
    ec_brenda: "1.1.1.36"
    require_pha_context: false
    disambiguation_terms: []
    broad_uniprot_search: false

  - family_id: phaC
    display_name: "PhaC (PHA synthase)"
    role: "PHA synthase"
